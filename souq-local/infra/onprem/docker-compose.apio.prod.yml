# Production APIO at https://dribex.ma/APIO/
# Requires souq-local/apio/ (sync from Azelos maisonmaroc) and .env.apio.prod
# Usage: scripts/apio-prod-deploy.sh

services:
  apio-server:
    build:
      context: ../../apio
      dockerfile: Dockerfile.server
    restart: unless-stopped
    env_file:
      - .env.apio.prod
    environment:
      NODE_ENV: production
      PORT: 3001
    volumes:
      - apio_data:/data
    networks: [internal]
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  apio-web:
    build:
      context: ../../apio
      dockerfile: Dockerfile.web
    restart: unless-stopped
    networks: [internal]
    depends_on:
      apio-server:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"

  # Tailscale / operator access only — NOT https://dribex.ma/APIO/admin (public SPA blocks that).
  apio-admin:
    build:
      context: ../../apio
      dockerfile: Dockerfile.admin
    restart: unless-stopped
    env_file:
      - .env.apio.prod
    environment:
      NODE_ENV: production
      APIO_ADMIN_PORT: 7217
      APIO_ADMIN_BIND: 0.0.0.0
      APIO_ADMIN_STATIC_DIR: /app/admin/dist
    volumes:
      - apio_data:/data
    ports:
      - "127.0.0.1:7217:7217"
    networks: [internal]
    depends_on:
      apio-server:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  # Do NOT add nginx depends_on apio-* here — if APIO is down, Dribex must still serve / over 443.
  # /APIO/* may 502 until apio-server/apio-web are healthy.

volumes:
  apio_data:
