# Production APIO at https://dribex.ma/APIO/
# Requires souq-local/apio/ (sync from Azelos maisonmaroc) and .env.apio.prod
# Usage: scripts/apio-prod-deploy.sh

services:
  apio-server:
    build:
      context: ../../apio
      dockerfile: Dockerfile.server
    restart: unless-stopped
    env_file:
      - .env.apio.prod
    environment:
      NODE_ENV: production
      PORT: 3001
    volumes:
      - apio_data:/data
    networks: [internal]
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  apio-web:
    build:
      context: ../../apio
      dockerfile: Dockerfile.web
    restart: unless-stopped
    networks: [internal]
    depends_on:
      apio-server:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"

  nginx:
    depends_on:
      apio-server:
        condition: service_healthy
      apio-web:
        condition: service_healthy

volumes:
  apio_data:
