# Temporary APIO demo at https://dribex.ma/AIPO/
# Usage: see scripts/aipo-demo-enable.sh (not part of normal production-deploy)

services:
  aipo-web:
    build:
      context: ../../sites/aipo
      dockerfile: Dockerfile
    restart: unless-stopped
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/AIPO/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"

  nginx:
    depends_on:
      aipo-web:
        condition: service_healthy
