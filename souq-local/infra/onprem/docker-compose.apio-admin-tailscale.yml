# Tailscale-only APIO super-admin (NOT public internet).
#
# INCOMPATIBLE with `network_mode: host` in docker-compose.apio.prod.yml (current default).
# With host + APIO_ADMIN_BIND=127.0.0.1, use instead:
#   scripts/apio-admin-tailscale-serve.sh
#
# Usage on piocco (bridge network / published ports only):
#   export TAILSCALE_IP=$(tailscale ip -4)
#   docker compose -f docker-compose.prod.yml \
#     -f docker-compose.apio.prod.yml \
#     -f docker-compose.apio-admin-tailscale.yml \
#     --env-file .env.prod up -d --force-recreate apio-admin
#
# Browser (device on Tailscale): http://${TAILSCALE_IP}:${APIO_ADMIN_PORT:-7217}/login
#
# Compose interpolates TAILSCALE_IP from the shell OR from a file named `.env` in this directory
# (--env-file .env.prod does NOT substitute into compose YAML on some installs).
# Either:  export TAILSCALE_IP=$(tailscale ip -4)
# Or:      echo "TAILSCALE_IP=$(tailscale ip -4)" >> .env
# And in .env.apio.prod:
#   APIO_ADMIN_ALLOWED_NETWORKS=100.64.0.0/10,127.0.0.0/8

services:
  apio-admin:
    ports:
      - "${TAILSCALE_IP:?set TAILSCALE_IP}:${APIO_ADMIN_PORT:-7217}:7217"
      - "127.0.0.1:${APIO_ADMIN_PORT:-7217}:7217"
