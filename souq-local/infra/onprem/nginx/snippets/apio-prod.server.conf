location = /APIO {
    return 301 /APIO/;
}

# Super-admin SPA (allowlist) — before /APIO/
location /APIO/admin {
    include /etc/nginx/server.d/dribex-ma/apio-admin-allow.conf;
    deny all;
    proxy_pass http://apio_web;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Super-admin API (allowlist)
location /APIO/api/admin/ {
    include /etc/nginx/server.d/dribex-ma/apio-admin-allow.conf;
    deny all;
    limit_req zone=api burst=60 nodelay;
    proxy_pass http://apio_server/api/admin/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 12m;
    proxy_read_timeout 120s;
}

location /APIO/api/auth/admin {
    include /etc/nginx/server.d/dribex-ma/apio-admin-allow.conf;
    deny all;
    limit_req zone=api burst=60 nodelay;
    proxy_pass http://apio_server/api/auth/admin;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /APIO/api/ {
    limit_req zone=api burst=60 nodelay;
    proxy_pass http://apio_server/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 12m;
    proxy_read_timeout 120s;
}

location /APIO/ {
    proxy_pass http://apio_web;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
