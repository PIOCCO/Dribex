# APIO Super Admin — Tailscale-only (NOT https://dribex.ma/APIO/admin).
# Install on the HOST if you run nginx outside Docker, or use: tailscale serve --bg --http=7217 http://127.0.0.1:7217
#
# Replace TS_IP with: tailscale ip -4

server {
    listen TS_IP:7217;
    listen [::1]:7217;

    allow 100.64.0.0/10;
    allow 127.0.0.1;
    deny all;

    server_name _;

    client_max_body_size 12m;

    location / {
        proxy_pass http://127.0.0.1:7217;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
